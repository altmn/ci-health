name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up minimum Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Test minimum Python
        run: python -m unittest discover -s tests -v
      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          check-latest: true
      - name: Test current stable Python
        run: python -m unittest discover -s tests -v
      - name: Validate and build package
        run: |
          python scripts/release.py validate
          python scripts/release.py build
      - name: Retain review archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-health-plugin
          path: |
            dist/ci-health-*.zip
            dist/ci-health-*.sha256
            dist/build-info.json
          if-no-files-found: error
          retention-days: 14
